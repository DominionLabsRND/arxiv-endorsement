name: Validate Requests

on:
  pull_request:
    paths:
      - "requests/*.txt"
      - "scripts/validate_request_files.py"
      - ".github/workflows/validate-requests.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "requests/*.txt"
      - "scripts/validate_request_files.py"
      - ".github/workflows/validate-requests.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to (re-)validate, e.g. if GitHub failed to trigger the check automatically"
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate request files
        run: python scripts/validate_request_files.py
