name: Register Merged Endorsement

# pull_request_target (not pull_request) so secrets are available; safe because the
# job only runs post-merge, on code a maintainer already reviewed and merged.
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged endorsement PR number to (re-)register"
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: arxiv-endorsement-registration
  cancel-in-progress: false

jobs:
  endorse:
    # Secrets are only used after a PR has been merged into the default branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          if [ "$(jq -r '.merged' <<< "$pr_json")" != "true" ] || \
             [ "$(jq -r '.base.ref' <<< "$pr_json")" != "$default_branch" ]; then
            echo "PR #${PR_NUMBER} is not a merged PR into the default branch." >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$(jq -r '.merge_commit_sha' <<< "$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Check out the merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.merge_sha }}
          # Safe: the previous step already verified this PR is merged into the
          # default branch, so merge_sha is base-repo history, not fork-controlled code.
          allow-unsafe-pr-checkout: true

      - name: Use the maintained registration script
        run: |
          set -euo pipefail
          # The request file comes from the merged revision above; the scripts
          # run the latest reviewed version from the default branch instead of
          # the possibly stale copy recorded in the merge commit.
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --depth=1 origin "$default_branch"
          git checkout FETCH_HEAD -- scripts

      - name: Locate the new endorsement request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          request_file="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | select(.status == "added" and (.filename | test("^requests/[^/]+\\.txt$"))) | .filename'
          )"
          if [ -z "$request_file" ] || [ "$(printf '%s\n' "$request_file" | wc -l)" -ne 1 ]; then
            echo "A merged endorsement PR must add exactly one requests/*.txt file." >&2
            exit 1
          fi
          echo "file=$request_file" >> "$GITHUB_OUTPUT"

      - name: Skip an already registered request
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[].body')"
          if grep -Fq '<!-- arxiv-endorsement-registered -->' <<< "$comments"; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Register endorsement with arXiv
        id: register
        if: steps.prior.outputs.registered != 'true'
        env:
          ARXIV_USERNAME: ${{ secrets.ARXIV_USERNAME }}
          ARXIV_PASSWORD: ${{ secrets.ARXIV_PASSWORD }}
        run: python scripts/endorse_merged_request.py "${{ steps.request.outputs.file }}"

      - name: Ask for a reissued endorsement code on the pull request
        if: failure() && steps.register.outputs.wrong_subject
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          WRONG_SUBJECT: ${{ steps.register.outputs.wrong_subject }}
        run: |
          gh pr comment "$PR_NUMBER" --body "<!-- arxiv-endorsement-wrong-subject -->
          The arXiv endorsement code on the arXiv server is for **$WRONG_SUBJECT**, not **cs.SE**. Reissue a new endorsement code for **cs.SE** and open a new pull request with it."

      - name: Record successful registration on the pull request
        if: steps.prior.outputs.registered != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REQUEST_FILE: ${{ steps.request.outputs.file }}
        run: |
          gh pr comment "$PR_NUMBER" --body "<!-- arxiv-endorsement-registered -->
          Registered the endorsement code from \`$REQUEST_FILE\` with arXiv."
